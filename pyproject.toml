[project]
name = "brain-terminal"
version = "0.1.0"
description = "Live trace & function-I/O inspector for a running Python backend: pick functions, watch their arguments, return values, exceptions and nested calls stream in."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
brain-terminal = "backend.main:main"
brain-terminal-dev = "backend.dev:main"
brain-terminal-mcp = "backend.mcp_server:main"
