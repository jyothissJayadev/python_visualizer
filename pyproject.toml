[project]
name = "python-backend-explorer"
version = "0.1.0"
description = "Point at an existing Python backend, browse its functions, and execute them from a web UI without modifying the backend."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
python-explorer = "backend.main:main"
